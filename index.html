<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rota Cheia</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
        body{background:#0f172a;color:#fff;padding:20px;max-width:500px;margin:0 auto}
        h2{color:#fbbf24;margin-bottom:20px}
        .voltar{background:#334155;border:none;color:#fff;padding:10px 20px;border-radius:8px;margin-bottom:20px;cursor:pointer;font-size:16px}
        .grupo{margin-bottom:15px}
        label{display:block;margin-bottom:5px;font-weight:bold}
        input{width:100%;padding:12px;border:2px solid #475569;border-radius:8px;background:#1e293b;color:#fff;font-size:16px}
        .pagamento{display:flex;gap:10px;margin:15px 0}
        .pag-opcao{flex:1;padding:12px;border:2px solid #475569;border-radius:8px;text-align:center;cursor:pointer}
        .pag-opcao.ativo{border-color:#fbbf24;background:rgba(251,191,36,0.2)}
        .btn{width:100%;padding:14px;border:none;border-radius:8px;font-size:18px;font-weight:bold;cursor:pointer;margin-top:10px}
        .btn-verde{background:#22c55e;color:#fff}
        .btn-azul{background:#3b82f6;color:#fff}
        .btn-vermelho{background:#ea4335;color:#fff}
        .caixa{background:#1e293b;padding:15px;border-radius:10px;margin:15px 0;border:2px solid #fbbf24}
        .km{font-size:22px;font-weight:bold;color:#22c55e;text-align:center;margin:10px 0}
        .oculto{display:none}
        .cartao{background:#1e293b;padding:15px;border-radius:10px;margin-bottom:10px;border-left:4px solid #22c55e}
        .etiqueta{display:inline-block;padding:4px 12px;border-radius:20px;font-size:14px;font-weight:bold;margin-bottom:10px}
        .disponivel{background:#f59e0b;color:#000}
        .aceita{background:#3b82f6;color:#fff}
        .codigo{font-size:30px;font-weight:bold;color:#fbbf24;letter-spacing:5px;text-align:center;margin:15px 0}
        .aba{display:none}
        .aba.ativa{display:block}
        .inicial{text-align:center;padding-top:20px}
        .botao-principal{width:100%;padding:18px;border:none;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer;margin-bottom:12px;text-align:left}
        .b-loja{background:linear-gradient(90deg,#d97706,#f59e0b);color:#000}
        .b-entregador{background:linear-gradient(90deg,#15803d,#22c55e);color:#fff}
        .b-admin{background:linear-gradient(90deg,#1d4ed8,#3b82f6);color:#fff}
    </style>
</head>
<body>

<!-- TELA INICIAL -->
<div id="inicial" class="aba ativa inicial">
    <h1 style="color:#fbbf24;margin-bottom:30px">🛡️ Rota Cheia</h1>
    <button class="botao-principal b-loja" onclick="abrirAba('loja')">🏪 Solicitar Entrega</button>
    <button class="botao-principal b-entregador" onclick="abrirAba('entregador')">🏍️ Sou Entregador</button>
    <button class="botao-principal b-admin" onclick="abrirAba('admin')">🔐 Administrador</button>
</div>

<!-- TELA LOJA -->
<div id="loja" class="aba">
    <button class="voltar" onclick="abrirAba('inicial')">← Voltar</button>
    <h2>🏪 Solicitar Entrega</h2>
    
    <div class="caixa">
        <p>Preço: R$ 5,00 fixo + R$ 1,90/km</p>
    </div>

    <div class="grupo">
        <label>Nome da Loja *</label>
        <input type="text" id="nomeLoja" placeholder="Ex: Mercearia Moron">
    </div>

    <div class="grupo">
        <label>Endereço de Saída *</label>
        <input type="text" id="saida" placeholder="Ex: Morom 233" oninput="calcular()">
    </div>

    <div class="grupo">
        <label>Endereço de Destino *</label>
        <input type="text" id="destino" placeholder="Ex: Rio Branco 1406" oninput="calcular()">
    </div>

    <div class="km" id="resultadoKm">Digite os endereços ↑</div>

    <div class="grupo">
        <label>Forma de Pagamento *</label>
        <div class="pagamento">
            <div class="pag-opcao" id="pag-dinheiro" onclick="escolherPag('dinheiro')">💵 Dinheiro</div>
            <div class="pag-opcao" id="pag-pix" onclick="escolherPag('pix')">🔷 Pix</div>
            <div class="pag-opcao" id="pag-cartao" onclick="escolherPag('cartao')">💳 Cartão</div>
        </div>
    </div>

    <button class="btn btn-verde" onclick="publicar()">✅ Publicar Entrega</button>

    <div id="sucessoPublicar" class="oculto">
        <div class="caixa">
            <h3>✅ Entrega Publicada!</h3>
            <p style="margin:10px 0">Código para o entregador:</p>
            <div class="codigo" id="codigoGerado"></div>
        </div>
        <button class="btn btn-azul" onclick="abrirAba('inicial')">🏠 Voltar ao Início</button>
    </div>
</div>

<!-- TELA ENTREGADOR -->
<div id="entregador" class="aba">
    <button class="voltar" onclick="abrirAba('inicial')">← Voltar</button>
    <h2>🏍️ Entregas Disponíveis</h2>
    <div id="listaEntregas">
        <p style="text-align:center;color:#94a3b8">Nenhuma entrega disponível.</p>
    </div>
</div>

<!-- TELA ADMIN -->
<div id="admin" class="aba">
    <button class="voltar" onclick="abrirAba('inicial')">← Voltar</button>
    <h2>🔐 Área Restrita</h2>
    <div class="grupo">
        <label>Código de Acesso</label>
        <input type="password" id="senhaAdmin" placeholder="Digite seu código">
    </div>
    <button class="btn btn-azul" onclick="entrarAdmin()">🔑 Entrar</button>
    <div id="painelAdmin" class="oculto" style="margin-top:20px">
        <div class="caixa">
            <h3>💰 Saldo: R$ <span id="saldo">0,00</span></h3>
        </div>
        <p style="margin:10px 0">Entregas concluídas: <span id="qtdConcluidas">0</span></p>
        <button class="btn btn-verde" onclick="exportar()">📥 Salvar Dados</button>
    </div>
</div>

<script>
const ARRANCADA = 5.00;
const PRECO_KM = 1.90;
const TAXA = 0.20;
let entregas = JSON.parse(localStorage.getItem('entregas') || '[]');
let escolhaPag = '';

function abrirAba(nome){
    document.querySelectorAll('.aba').forEach(a=>a.classList.remove('ativa'));
    document.getElementById(nome).classList.add('ativa');
    if(nome==='entregador') listarEntregas();
}

function escolherPag(tipo){
    document.querySelectorAll('.pag-opcao').forEach(p=>p.classList.remove('ativo'));
    document.getElementById('pag-'+tipo).classList.add('ativo');
    escolhaPag = tipo;
}

function calcular(){
    const s = document.getElementById('saida').value.trim();
    const d = document.getElementById('destino').value.trim();
    if(s.length>=3 && d.length>=3){
        const distancia = Math.round(Math.random()*15+10)/2;
        const valorKm = distancia * PRECO_KM;
        const total = ARRANCADA + valorKm;
        document.getElementById('resultadoKm').innerHTML = 
            `${distancia.toFixed(1)} km — Total: R$ ${total.toFixed(2)}<br>Entregador recebe: R$ ${(total*0.8).toFixed(2)}`;
        return {distancia, total};
    }
    document.getElementById('resultadoKm').innerText = 'Digite os endereços ↑';
    return null;
}

function gerarCodigo(){
    return Math.floor(1000+Math.random()*9000).toString();
}

function publicar(){
    const nome = document.getElementById('nomeLoja').value.trim();
    const saida = document.getElementById('saida').value.trim();
    const destino = document.getElementById('destino').value.trim();
    const calc = calcular();
    
    if(!nome || !saida || !destino || !escolhaPag || !calc){
        alert('Preencha todos os campos!');
        return;
    }

    const entrega = {
        id: Date.now(),
        nome, saida, destino,
        distancia: calc.distancia,
        valorTotal: calc.total,
        valorEntregador: calc.total * 0.8,
        taxa: calc.total * TAXA,
        pagamento: escolhaPag,
        codigo: gerarCodigo(),
        status: 'disponivel'
    };

    entregas.unshift(entrega);
    salvar();
    
    document.getElementById('codigoGerado').innerText = entrega.codigo;
    document.getElementById('sucessoPublicar').classList.remove('oculto');
    document.getElementById('nomeLoja').value='';
    document.getElementById('saida').value='';
    document.getElementById('destino').value='';
    document.querySelectorAll('.pag-opcao').forEach(p=>p.classList.remove('ativo'));
    escolhaPag='';
}

function listarEntregas(){
    const lista = document.getElementById('listaEntregas');
    if(entregas.length===0){
        lista.innerHTML = '<p style="text-align:center;color:#94a3b8">Nenhuma entrega disponível.</p>';
        return;
    }
    lista.innerHTML = entregas.map(e=>`
        <div class="cartao">
            <span class="etiqueta ${e.status==='disponivel'?'disponivel':'aceita'}">${e.status==='disponivel'?'DISPONÍVEL':'EM ANDAMENTO'}</span>
            <p><strong>🏪 ${e.nome}</strong></p>
            <p>📍 De: ${e.saida}</p>
            <p>📍 Para: ${e.destino}</p>
            <p>📏 ${e.distancia.toFixed(1)} km</p>
            <p>💰 R$ ${e.valorEntregador.toFixed(2)}</p>
            <p>💳 ${e.pagamento.toUpperCase()}</p>
            ${e.status==='disponivel'?
                `<button class="btn btn-azul" onclick="aceitar(${e.id})">✅ Aceitar Entrega</button>`:
                `<a href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(e.saida)}&destination=${encodeURIComponent(e.destino)}&travelmode=driving" target="_blank">
                    <button class="btn btn-vermelho">📍 Abrir Rota no Google Maps</button>
                </a>
                <div style="margin-top:10px">
                    <input type="text" id="confirma-${e.id}" placeholder="Digite o código" style="width:100%;margin-bottom:8px">
                    <button class="btn btn-verde" onclick="concluir(${e.id})">✅ Concluir Entrega</button>
                </div>`
            }
        </div>
    `).join('');
}

function aceitar(id){
    const e = entregas.find(x=>x.id===id);
    if(e){
        e.status = 'aceita';
        salvar();
        listarEntregas();
        alert('✅ Entrega aceita! Agora confirme o código quando chegar.');
    }
}

function concluir(id){
    const e = entregas.find(x=>x.id===id);
    const digitado = document.getElementById(`confirma-${id}`).value.trim();
    if(digitado === e.codigo){
        e.status = 'concluida';
        salvar();
        listarEntregas();
        alert('🎉 Entrega concluída com sucesso!');
    }else{
        alert('❌ Código errado!');
    }
}

function entrarAdmin(){
    if(document.getElementById('senhaAdmin').value==='123456'){
        document.getElementById('painelAdmin').classList.remove('oculto');
        atualizarAdmin();
    }else alert('Código errado!');
}

function atualizarAdmin(){
    const concluidas = entregas.filter(e=>e.status==='concluida');
    const total = concluidas.reduce((s,e)=>s+e.taxa,0);
    document.getElementById('saldo').innerText = total.toFixed(2);
    document.getElementById('qtdConcluidas').innerText = concluidas.length;
}

function salvar(){
    localStorage.setItem('entregas', JSON.stringify(entregas));
}

function exportar(){
    const dados = JSON.stringify(entregas,null,2);
    const blob = new Blob([dados],{type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'rotacheia-dados.json';
    a.click();
}
</script>
</body>
</html>
