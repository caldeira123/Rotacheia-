<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rota Cheia — Nenhuma entrega volta vazia</title>
    <meta name="author" content="Rota Cheia — Sistema Exclusivo">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Arial, sans-serif; }
        body { background-color: #0f172a; color: #fff; min-height: 100vh; padding: 20px; }
        
        .container { max-width: 420px; margin: 0 auto; }
        h1 { text-align: center; color: #facc15; margin-bottom: 25px; font-size: 1.4rem; }
        
        .input-box { background: #1e293b; border-radius: 12px; padding: 14px; margin-bottom: 15px; }
        .input-box label { display: block; margin-bottom: 8px; color: #cbd5e1; font-size: 0.9rem; }
        .input-box input, .input-box select { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #334155; color: #fff; font-size: 1rem; }
        
        .btn-local { width: 100%; padding: 14px; background: #f59e0b; border: none; border-radius: 10px; color: #000; font-weight: bold; font-size: 1rem; cursor: pointer; margin-bottom: 15px; }
        .btn-calcular { width: 100%; padding: 16px; background: #22c55e; border: none; border-radius: 10px; color: #fff; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin: 10px 0; }
        .btn-publicar { width: 100%; padding: 16px; background: #16a34a; border: none; border-radius: 10px; color: #fff; font-weight: bold; font-size: 1.1rem; cursor: pointer; margin-top: 10px; }
        
        .resultado { background: #14532d; border: 2px solid #22c55e; border-radius: 14px; padding: 25px; margin: 20px 0; text-align: center; }
        .distancia { font-size: 1.1rem; color: #86efac; margin-bottom: 10px; }
        .valor-detalhe { font-size: 0.95rem; color: #dcfce7; margin: 6px 0; }
        .total { font-size: 2rem; font-weight: bold; color: #fff; margin: 15px 0; }
        .pagamento-info { color: #bbf7d0; font-size: 0.95rem; }
        
        .coordenadas { font-size: 0.75rem; color: #94a3b8; margin-top: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Rota Cheia</h1>

    <!-- Passo 1: Origem -->
    <div class="input-box">
        <label>🏪 Nome do local / Loja</label>
        <input type="text" id="nomeOrigem" placeholder="Ex: Mercearia Moron">
    </div>

    <button class="btn-local" onclick="pegarLocalizacao()">
        📍 Usar minha localização atual
    </button>
    
    <div class="input-box">
        <label>📍 Ponto de Partida</label>
        <input type="text" id="origem" placeholder="Clicou acima? Aparece aqui automaticamente" readonly>
        <div class="coordenadas" id="coordOrigem"></div>
    </div>

    <!-- Passo 2: Destino -->
    <div class="input-box">
        <label>📦 Passo 2: Endereço de Entrega</label>
        <input type="text" id="destino" placeholder="Ex: Rua Rio Branco, 1406">
    </div>

    <!-- Passo 3: Pagamento -->
    <div class="input-box">
        <label>💳 Passo 3: Forma de Pagamento</label>
        <select id="pagamento">
            <option value="PIX — Mais Rápido" selected>✅ PIX — Mais Rápido</option>
            <option value="Dinheiro">💵 Dinheiro</option>
            <option value="Cartão">💳 Cartão</option>
        </select>
    </div>

    <!-- Botão Calcular -->
    <button class="btn-calcular" onclick="calcularValor()">
        ⚡ CALCULAR VALOR
    </button>

    <!-- Resultado -->
    <div class="resultado" id="resultado" style="display: none;">
        <div class="distancia" id="distanciaInfo"></div>
        <div class="valor-detalhe">💵 Arrancada: R$ 5,00</div>
        <div class="valor-detalhe" id="valorKm"></div>
        <hr style="border-color: #22c55e; margin: 12px 0;">
        <div class="total" id="valorTotal"></div>
        <div class="pagamento-info" id="formaPagamento"></div>
    </div>

    <!-- Botão Publicar -->
    <button class="btn-publicar" id="btnPublicar" style="display: none;" onclick="publicarCorrida()">
        ✅ PUBLICAR CORRIDA
    </button>

</div>

<script>
let latOrigem = null;
let lngOrigem = null;

// 📍 Pegar localização atual
function pegarLocalizacao() {
    if (!navigator.geolocation) {
        alert('❌ Seu celular não suporta GPS');
        return;
    }
    
    navigator.geolocation.getCurrentPosition(
        function(posicao) {
            latOrigem = posicao.coords.latitude;
            lngOrigem = posicao.coords.longitude;
            
            document.getElementById('origem').value = '📍 Localização atual obtida';
            document.getElementById('coordOrigem').innerText = `${latOrigem.toFixed(6)}, ${lngOrigem.toFixed(6)}`;
            
            alert('✅ Localização capturada com sucesso!');
        },
        function(erro) {
            let mensagem;
            switch(erro.code) {
                case 1: mensagem = '⚠️ Permita o acesso à localização!'; break;
                case 2: mensagem = '❌ Não foi possível encontrar sua localização'; break;
                case 3: mensagem = '⏳ Tempo esgotado. Tente novamente.'; break;
                default: mensagem = '❌ Erro desconhecido';
            }
            alert(mensagem);
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
}

// 📏 Fórmula de Haversine — Cálculo PRECISO de distância entre 2 pontos GPS
function calcularDistancia(lat1, lng1, lat2, lng2) {
    const R = 6371; // Raio da Terra em km
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLng/2) * Math.sin(dLng/2);
    
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    
    return R * c; // Distância em km
}

// 🧠 Converter endereço aproximado para coordenadas (simplificado)
function enderecoParaCoordenadas(endereco) {
    // Aqui usamos valores aproximados baseados em Rio Grande/RS
    // Para versão profissional: usar API Google Maps ou OpenStreetMap
    const end = endereco.toLowerCase();
    
    // Centro de Rio Grande/RS como referência
    let latBase = -32.0348;
    let lngBase = -52.1031;
    
    if (end.includes('rio branco')) {
        latBase = -32.0385;
        lngBase = -52.1015;
    } else if (end.includes('av brasil')) {
        latBase = -32.0320;
        lngBase = -52.0980;
    } else if (end.includes('pelotas')) {
        latBase = -31.7654;
        lngBase = -52.3376;
    }
    
    return { lat: latBase, lng: lngBase };
}

// 💰 Calcular valor final
function calcularValor() {
    if (!latOrigem || !lngOrigem) {
        alert('⚠️ Clique primeiro em "Usar minha localização atual"');
        return;
    }
    
    const destinoTxt = document.getElementById('destino').value;
    if (!destinoTxt) {
        alert('⚠️ Digite o endereço de entrega');
        return;
    }
    
    // Pegar coordenadas do destino
    const destinoCoord = enderecoParaCoordenadas(destinoTxt);
    
    // Calcular distância REAL
    const distancia = calcularDistancia(latOrigem, lngOrigem, destinoCoord.lat, destinoCoord.lng);
    const distanciaArredondada = Math.round(distancia * 10) / 10; // 1 casa decimal
    
    // Valores fixos
    const arrancada = 5.00;
    const valorPorKm = 1.90;
    const valorPercurso = distancia * valorPorKm;
    const total = arrancada + valorPercurso;
    
    // Exibir
    document.getElementById('distanciaInfo').innerHTML = `📏 Distância: ${distanciaArredondada} km`;
    document.getElementById('valorKm').innerHTML = `🛣️ R$ 1,90 × ${distanciaArredondada} km = R$ ${valorPercurso.toFixed(2)}`;
    document.getElementById('valorTotal').innerHTML = `R$ ${total.toFixed(2)}`;
    document.getElementById('formaPagamento').innerHTML = 'Pagamento: ' + document.getElementById('pagamento').value;
    
    document.getElementById('resultado').style.display = 'block';
    document.getElementById('btnPublicar').style.display = 'block';
}

function publicarCorrida() {
    alert('✅ Corrida publicada! Os entregadores vão receber a notificação.');
}
</script>

</body>
</html>
