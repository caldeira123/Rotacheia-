<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rota Cheia</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f5f5f5;
      color: #333;
    }

    .app-container {
      max-width: 480px;
      margin: 0 auto;
      background-color: #fff;
      min-height: 100vh;
      padding-bottom: 20px;
    }

    .capa-container {
      width: 100%;
      position: relative;
    }

    .capa-imagem {
      width: 100%;
      display: block;
      height: auto;
    }

    .aba {
      display: none;
      padding: 20px;
    }

    .aba.ativa {
      display: block;
    }

    .botoes-capa {
      padding: 20px;
    }

    .botao-nav {
      width: 100%;
      padding: 18px;
      margin: 10px 0;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .botao-loja {
      background: linear-gradient(90deg, #f59e0b, #eab308);
      color: #000;
    }

    .botao-entregador {
      background: linear-gradient(90deg, #16a34a, #22c55e);
      color: white;
    }

    .botao-admin {
      background: linear-gradient(90deg, #2563eb, #3b82f6);
      color: white;
    }

    .botao-voltar {
      background: #6c757d;
      color: white;
      padding: 12px 30px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      margin-top: 20px;
      cursor: pointer;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #222;
    }

    input, select, textarea {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    button[type="submit"] {
      background: #2563eb;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .lista-entregas {
      margin-top: 15px;
    }

    .cartao-entrega {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .rodape {
      text-align: center;
      padding: 20px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="app-container">
    
    <div id="capa" class="capa-container">
      <img src="compartilhar_imagem_1788920713078.jpeg" alt="Rota Cheia - Nenhuma entrega volta vazia" class="capa-imagem" style="width:100%; height:220px; object-fit:cover;">

  <span style="font-size:32px; font-weight:bold;">🛵 Rota Cheia</span>
  <span style="font-size:16px; margin-top:8px;">Nenhuma entrega volta vazia ✅</span>
</div>

      <div class="botoes-capa">
        <button class="botao-nav botao-loja" onclick="mostrarAba('loja')">
          <span>🏪 LOJA</span>
          <span>➤</span>
        </button>

        <button class="botao-nav botao-entregador" onclick="mostrarAba('entregador')">
          <span>🏍️ ENTREGADOR</span>
          <span>➤</span>
        </button>

        <button class="botao-nav botao-admin" onclick="mostrarAba('gerenciar-entregadores')">
          <span>👨‍💼 ADMINISTRADOR</span>
          <span>➤</span>
        </button>
      </div>

      <div class="rodape">
        <strong>Rota Cheia</strong><br>
        Versão 1.0 — "Nenhuma entrega volta vazia"
      </div>
    </div>

    <div id="aba-loja" class="aba">
      <h2>🏪 Publicar Entrega</h2>
      <form onsubmit="publicarEntrega(event)">
        <input type="text" placeholder="📍 Endereço de Coleta" required>
        <input type="text" placeholder="📍 Endereço de Entrega" required>
        <input type="text" placeholder="📦 Descrição do produto" required>
        <input type="number" step="0.01" placeholder="💰 Valor da entrega R$" required>
        <input type="tel" placeholder="📞 Seu WhatsApp" required>
        <button type="submit">✅ Publicar Entrega</button>
      </form>
      <button class="botao-voltar" onclick="voltarCapa()">⬅️ Voltar</button>
    </div>

    <div id="aba-entregador" class="aba">
      <h2>🏍️ Entregas Disponíveis</h2>
      <div class="lista-entregas" id="lista-entregas">
        <p style="text-align:center; color:#666; padding:20px;">Aguardando novas entregas...</p>
      </div>
      <button class="botao-voltar" onclick="voltarCapa()">⬅️ Voltar</button>
    </div>

    <div id="aba-gerenciar-entregadores" class="aba">
      <h2>👨‍💼 Cadastrar Entregador</h2>
      <form onsubmit="cadastrarEntregador(event)">
        <input type="text" placeholder="👤 Nome Completo" required>
        <input type="text" placeholder="📄 CPF" required>
        <input type="tel" placeholder="📞 Telefone / WhatsApp" required>
        <input type="text" placeholder="🏍️ Placa da Moto" required>
        <input type="email" placeholder="📧 E-mail" required>
        <input type="password" placeholder="🔑 Senha" required>
        <button type="submit">💾 Cadastrar</button>
      </form>
      <button class="botao-voltar" onclick="voltarCapa()">⬅️ Voltar</button>
    </div>

  </div>

  <script>
    function mostrarAba(nomeAba) {
      document.getElementById('capa').style.display = 'none';
      const abas = document.querySelectorAll('.aba');
      abas.forEach(aba => aba.classList.remove('ativa'));
      document.getElementById('aba-' + nomeAba).classList.add('ativa');
      window.scrollTo(0, 0);
    }

    function voltarCapa() {
      const abas = document.querySelectorAll('.aba');
      abas.forEach(aba => aba.classList.remove('ativa'));
      document.getElementById('capa').style.display = 'block';
      window.scrollTo(0, 0);
    }

    function publicarEntrega(event) {
      event.preventDefault();
      alert('✅ Entrega publicada com sucesso!\\n\\nUm entregador vai aceitar em breve. 🛵💨');
      event.target.reset();
      voltarCapa();
    }

    function cadastrarEntregador(event) {
      event.preventDefault();
      alert('✅ Entregador cadastrado com sucesso!\\n\\nBem-vindo à equipe Rota Cheia! 🛵🎉');
      event.target.reset();
      voltarCapa();
    }
  </script>
</body>
</html>
